<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>

  <body class="root">
    <div class="calc-grid">
      <div class="output">
        <div data-previous-operand class="previous-operand"></div>
        <div data-current-operand class="current-operand"></div>
      </div>
      <button data-memory>MC</button>
      <button data-operation>x^2</button>
      <button data-remove><=</button>
      <button data-clear>AC</button>
      <button data-plusminus-sign>+/-</button>
      <button data-operation>%</button>
      <button data-operation>/</button>
      <button data-memory>M+</button>
      <button data-operation>10^x</button>
      <button data-operation>x^3</button>
      <button data-number>7</button>
      <button data-number>8</button>
      <button data-number>9</button>
      <button data-operation>*</button>
      <button data-memory>M-</button>
      <button data-operation>1/x</button>
      <button data-operation>x^y</button>
      <button data-number>4</button>
      <button data-number>5</button>
      <button data-number>6</button>
      <button data-operation>-</button>
      <button data-memory>MR</button>
      <button data-operation>sqrt</button>
      <button data-operation>sqrtx</button>
      <button data-number>1</button>
      <button data-number>2</button>
      <button data-number>3</button>
      <button data-operation>+</button>
      <button data-special>e</button>
      <button data-special>pi</button>
      <button data-operation>sqrt3</button>
      <button data-number>0</button>
      <button data-number>.</button>
      <button data-equals>=</button>

      <button data-theme-toggle>TH</button>
    </div>
  </body>
</html>
